<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RoomSync - Floor Manager</title>

    <link rel="stylesheet" href="manager.css">
</head>

<body>

    <header>
        <h1>RoomSync</h1>
        <p>Floor Manager Dashboard</p>
    </header>

    <main>

        <section class="floor-section">

            <h2>Floor 1</h2>

            <div class="room-card">

                <div>
                    <h3>Room 101</h3>
                    <p>Status: <span id="status-101">EMPTY</span></p>
                </div>

                <div class="buttons">
                    <button onclick="updateStatus('101', 'EMPTY')">
                        Empty
                    </button>

                    <button onclick="updateStatus('101', 'OCCUPIED')">
                        Occupied
                    </button>
                </div>

            </div>


            <div class="room-card">

            </div>


            <div class="room-card">

        </section>


        <section class="floor-section">

                </div>

                <div>

    </main>

    <script src="manager.js"></script>

</body>

</html>
